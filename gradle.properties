kotlin.code.style=official
# AGP 8.2.0 predates the Android 15 (API 35) SDK; suppress its compileSdk
# sanity check rather than bumping AGP (which would require Gradle 8.7+,
# conflicting with the pinned Gradle 8.5 wrapper).
android.suppressUnsupportedCompileSdk=35
