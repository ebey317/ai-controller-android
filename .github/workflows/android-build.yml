name: Android Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Lint (fails on errors)
      run: ./gradlew lintDebug --no-daemon

    - name: Unit tests
      run: ./gradlew testDebugUnitTest --no-daemon

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: ai-controller-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7

    - name: Upload lint report on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: lint-report
        path: app/build/reports/lint-results-debug.html
        retention-days: 7

    - name: Build summary
      if: always()
      run: |
        echo "## Android build result" >> $GITHUB_STEP_SUMMARY
        echo "- Lint (errors): enforced" >> $GITHUB_STEP_SUMMARY
        echo "- Unit tests: enforced" >> $GITHUB_STEP_SUMMARY
        echo "- Debug APK: built" >> $GITHUB_STEP_SUMMARY
